name: Android Build & v2.0 Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v2.0 APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk ACE-QQ-WeChat-Toolbox-v2.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ACE-Toolkit-v2.0-debug
          path: ACE-QQ-WeChat-Toolbox-v2.0-debug.apk

      - name: Publish or refresh GitHub Release v2.0
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v2.0 "$GITHUB_SHA"
          git push origin refs/tags/v2.0 --force

          NOTES="QQ/WeChat Toolbox 2.0 正式版本。包含 QQ/微信设置入口、清理工具、QQ SSAID 与 JavaScript 工具。此 Release 已通过 GitHub Actions Android 构建验证；附带 APK 为 CI debug 签名构建。"

          if gh release view v2.0 >/dev/null 2>&1; then
            gh release edit v2.0 --title "QQ/WeChat Toolbox v2.0" --notes "$NOTES"
            gh release upload v2.0 ACE-QQ-WeChat-Toolbox-v2.0-debug.apk --clobber
          else
            gh release create v2.0 ACE-QQ-WeChat-Toolbox-v2.0-debug.apk \
              --target "$GITHUB_SHA" \
              --title "QQ/WeChat Toolbox v2.0" \
              --notes "$NOTES"
          fi
