name: Finalize ACE v0.3.6 source sync

on:
  push:
    branches: [ main ]
    paths:
      - '.sync/v036/b04.b64'

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and synchronize v0.3.6 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sync/staging
          cat .sync/v036/b*.b64 | base64 -d > .sync/v036/source.tar.xz
          tar -xJf .sync/v036/source.tar.xz -C .sync/staging
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.sync/' \
            --exclude '.gitignore' \
            --exclude '*.png' \
            --exclude '*.jar' \
            .sync/staging/ ./
          rm -rf .sync
          rm -f .github/workflows/sync-v036-final.yml
      - name: Verify synchronized version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 36' app/build.gradle.kts
          grep -q 'versionName = "0.3.6"' app/build.gradle.kts
          grep -q 'ACE 0.3.6 loaded' app/src/main/java/com/ace/toolbox/xposed/ModuleMain.java
          grep -q 'findFirstRecyclerViewLike' app/src/main/java/com/ace/toolbox/xposed/HostSettingInjector.java
          grep -q '((ViewGroup) recycler).setClipToPadding(false);' app/src/main/java/com/ace/toolbox/xposed/HostSettingInjector.java
      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'sync: ACE v0.3.6 source'
          git push origin HEAD:main
